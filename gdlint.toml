# gdlint configuration for Fallen Paths
# Run: gdlint res:// (local) or via CI pipeline

[general]
disable = [
    # Acceptable trade-offs in this codebase:
    "too-many-lines",        # CombatConstants.gd at 2600 lines is known (see LIVE_PATHS split plan)
    "too-many-locals",       # Complex resolve functions naturally have many locals
    "too-many-arguments",    # Some factory/resolve functions need many params
    "invalid-index",         # Dictionary access patterns used intentionally for combat data
]

# Harness files are large regression suites with many test functions and locals.
# Explicitly disable size-related rules so agents don't re-enable them.
[path:"res://combat/CombatRegressionHarness*.gd"]
disable = [
    "too-many-lines",
    "too-many-locals",
    "too-many-arguments",
    "invalid-index",
]
