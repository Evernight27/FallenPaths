name: Fallen Paths CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Official Linux editor asset uses dots: linux.x86_64 (not linux_x86_64).
  GODOT_VERSION: "4.7-stable"
  GODOT_BIN_NAME: "Godot_v4.7-stable_linux.x86_64"

jobs:
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_doc_links.py

  phase0-combat:
    name: Phase 0 Combat Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux.x86_64
      - name: Ensure Godot
        run: |
          chmod +x scripts/ci_ensure_godot.sh
          GODOT_DIR="${{ runner.temp }}/godot" scripts/ci_ensure_godot.sh
      - name: Run Phase 0
        run: |
          export GODOT="${{ runner.temp }}/godot/${{ env.GODOT_BIN_NAME }}"
          bash scripts/run_all_combat_checks.sh

  company-state:
    name: Company State Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux.x86_64
      - name: Ensure Godot
        run: |
          chmod +x scripts/ci_ensure_godot.sh
          GODOT_DIR="${{ runner.temp }}/godot" scripts/ci_ensure_godot.sh
      - name: Run company state checks
        run: |
          export GODOT="${{ runner.temp }}/godot/${{ env.GODOT_BIN_NAME }}"
          bash scripts/run_company_state_checks.sh
