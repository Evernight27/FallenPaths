name: Fallen Paths CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GODOT_VERSION: "4.7-stable"
  GODOT_ZIP: "Godot_v${{ env.GODOT_VERSION }}_linux_x86_64.zip"

jobs:
  setup-godot:
    name: Setup Godot (shared cache)
    runs-on: ubuntu-latest
    steps:
      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-${{ runner.arch }}
      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/godot
          curl -L "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/${{ env.GODOT_ZIP }}" -o "${{ runner.temp }}/godot.zip"
          unzip "${{ runner.temp }}/godot.zip" -d ${{ runner.temp }}/godot
          chmod +x ${{ runner.temp }}/godot/Godot_v${{ env.GODOT_VERSION }}_linux_x86_64

    outputs:
      godot_path: ${{ runner.temp }}/godot/Godot_v${{ env.GODOT_VERSION }}_linux_x86_64

  phase0-combat:
    name: Phase 0 Combat Checks
    runs-on: ubuntu-latest
    needs: setup-godot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Godot binary
        id: godot-restore
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-${{ runner.arch }}

      - name: Run Phase 0 combat checks (bash)
        run: |
          GODOT="${{ needs.setup-godot.outputs.godot_path }}" \
          bash scripts/run_all_combat_checks.sh

  company-state:
    name: Company State Checks
    runs-on: ubuntu-latest
    needs: setup-godot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Godot binary
        id: godot-restore
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-${{ runner.arch }}

      - name: Run company state checks (bash)
        run: |
          GODOT="${{ needs.setup-godot.outputs.godot_path }}" \
          bash scripts/run_company_state_checks.sh
