name: Fallen Paths CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Official Linux editor asset uses dots: linux.x86_64 (not linux_x86_64).
  GODOT_VERSION: "4.7-stable"
  GODOT_BIN_NAME: "Godot_v4.7-stable_linux.x86_64"

jobs:
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_doc_links.py

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck scripts/*.sh
        # Ubuntu apt shellcheck (0.9) lacks --rcfile=; scripts/.shellcheckrc is auto-discovered per-file.
        run: shellcheck -x scripts/*.sh

  gdscript-lint:
    name: GDScript lint (gdlint + gdformat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install gdtoolkit
        run: pip install -r requirements-ci.txt
      - name: gdlint
        run: gdlint .
      - name: gdformat --check
        run: gdformat --check .

  # PRs: company (~406) + combat regression harness. Full Phase 0 on main push.
  fast-phase0:
    name: Harness (company + regression)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux.x86_64
      - name: Ensure Godot
        run: |
          chmod +x scripts/ci_ensure_godot.sh
          GODOT_DIR="${{ runner.temp }}/godot" scripts/ci_ensure_godot.sh
      - name: Fast Phase 0
        env:
          GODOT: ${{ runner.temp }}/godot/${{ env.GODOT_BIN_NAME }}
          FP_SKIP_DOC_LINKS: "1"
        run: |
          chmod +x scripts/run_fast_phase0.sh
          bash scripts/run_fast_phase0.sh
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fast-phase0-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .phase0_*.txt
            .phase0_fast_regression.txt
            .harness_*.txt

  # main/master push + manual: full Phase 0 (includes company; docs covered by doc-links).
  phase0-combat:
    name: Phase 0 (full harness)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux.x86_64
      - name: Ensure Godot
        run: |
          chmod +x scripts/ci_ensure_godot.sh
          GODOT_DIR="${{ runner.temp }}/godot" scripts/ci_ensure_godot.sh
      - name: Run Phase 0
        env:
          GODOT: ${{ runner.temp }}/godot/${{ env.GODOT_BIN_NAME }}
          FP_SKIP_DOC_LINKS: "1"
        run: bash scripts/run_all_combat_checks.sh
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .phase0_*.txt
            .d001_*.txt
            .calibration_*.txt
            .campaign_ship_audit.txt
            .harness_*.txt
            .medical_phase_harness_out.txt
